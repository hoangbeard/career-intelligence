name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (scripts/doctor.py checks it) and newest.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: No personal data in the skeleton
        run: python3 scripts/guard.py
      - name: Wrappers match skills/
        run: python3 scripts/sync_wrappers.py --check
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Demo data index is current
        env:
          CAREER_INTELLIGENCE_DATA: examples/demo-data
        run: python3 scripts/build_index.py --check
      - name: Instance data index is current
        # Only in a private instance; the skeleton has no data/.
        if: hashFiles('.career-intelligence-instance') != ''
        run: python3 scripts/build_index.py --check

  pdf:
    # CV export on a fresh Linux machine, the same way a cloud agent sets it up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the PDF tools
        run: scripts/setup-pdf.sh
      - name: Install pdftotext (checks the PDF text layer)
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Export tests (must run, not skip)
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_export_cv.py' -v 2>&1 | tee test.log
          if grep -q skipped test.log; then echo "export tests were skipped" >&2; exit 1; fi
